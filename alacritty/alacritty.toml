
[window]
opacity = 0.8
decorations = "Buttonless"
title = "Alacritty"

  [window.dimensions]
  columns = 234
  lines = 68

  [window.padding]
  x = 4
  y = 2

[font]
size = 12

  [font.offset]
  y = 5

  [font.glyph_offset]
  y = 2

  [font.normal]
  family = "0xProto Nerd Font"
  style = "Regular"

  [font.bold]
  family = "0xProto Nerd Font"
  style = "Bold"

  [font.italic]
  family = "0xProto Nerd Font"
  style = "Italic"

  [font.bold_italic]
  family = "0xProto Nerd Font"
  style = "Bold Italic"

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/bin/zsh"
args = [ "--login" ]

[colors.primary]
background = "0x2D2A2E"
foreground = "0xfff1f3"

[colors.normal]
black = "0x2c2525"
red = "0xfd6883"
green = "0xadda78"
yellow = "0xf9cc6c"
blue = "0xf38d70"
magenta = "0xa8a9eb"
cyan = "0x85dacc"
white = "0xfff1f3"

[colors.bright]
black = "0x72696a"
red = "0xfd6883"
green = "0xadda78"
yellow = "0xf9cc6c"
blue = "0xf38d70"
magenta = "0xa8a9eb"
cyan = "0x85dacc"
white = "0xfff1f3"

[general]
live_config_reload = true

